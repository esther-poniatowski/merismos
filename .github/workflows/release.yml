# ==================================================================================================
# GitHub Actions Workflow: Semantic Release
#
# File: `.github/workflows/release.yml`
#
# Automates version bumping, changelog generation, and GitHub release creation
# based on conventional commit messages.
#
# Trigger: Manual only (workflow_dispatch) for safety.
#
# See Also
# --------
# - Python Semantic Release: https://python-semantic-release.readthedocs.io/
# - config/tools/releaserc.toml: Release configuration
# ==================================================================================================

name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semantic Release
        run: pip install python-semantic-release

      # The changelog is kept by hand at the root of the repository, so semantic-release writes none.
      - name: Run Semantic Release
        run: semantic-release --config config/tools/releaserc.toml version --no-changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A push made with GITHUB_TOKEN starts no workflow, so a new release starts the publication
      # explicitly, through workflow_dispatch, which GitHub admits from GITHUB_TOKEN.
      - name: Publish the Release
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            gh workflow run publish-noarch.yml --ref main
          else
            echo "::notice title=Publication skipped::no new release, so nothing is published."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
