# Conformance cases of the span kinds of Merismos, for Markdown sources.
# Each case lists the regions expected for its text, sorted by start, then by end in
# decreasing order.
# `observed` names the version of Obsidian in which the reading of the case was observed,
# and stays null until then.
contract: merismos:span-kinds@1
cases:
- id: frontmatter-at-start
  source: markdown
  observed: 1.15.0
  text: |
    ---
    tags: [a]
    ---
    Text $x$.
  regions:
  - kind: frontmatter
    range: [0, 17]
    content: [4, 14]
  - kind: inline-math
    range: [23, 26]
    content: [24, 25]
- id: frontmatter-not-at-start
  source: markdown
  observed: 1.15.0
  note: A fence after the first line opens no frontmatter.
  text: |2

    ---
    tags: [a]

    ---
  regions: []
- id: fenced-code-info-string
  source: markdown
  observed: 1.15.0
  note: No region is recognized inside fenced code.
  text: |
    ```python
    x = '$a$'
    ```
  regions:
  - kind: fenced-code
    range: [0, 23]
    content: [10, 20]
    attributes:
      info: python
- id: fenced-code-unclosed
  source: markdown
  observed: 1.15.0
  note: An unclosed fence runs to the end of its container.
  text: |
    ~~~
    $a$
  regions:
  - kind: fenced-code
    range: [0, 7]
    content: [4, 7]
    attributes:
      info: ''
- id: fenced-code-in-list-item
  source: markdown
  observed: 1.15.0
  note: The indentation of the list item is a gap of the content.
  text: |
    - item
      ```
      x
      ```
  regions:
  - kind: fenced-code
    range: [9, 22]
    content: [13, 17]
    gaps: [[13, 15]]
    attributes:
      info: ''
- id: inline-code-double-backticks
  source: markdown
  observed: 1.15.0
  text: Use ``a `$b$` c`` here.
  regions:
  - kind: inline-code
    range: [4, 17]
    content: [6, 15]
- id: inline-code-before-math
  source: markdown
  observed: 1.15.0
  text: '`$a$` and $b$'
  regions:
  - kind: inline-code
    range: [0, 5]
    content: [1, 4]
  - kind: inline-math
    range: [10, 13]
    content: [11, 12]
- id: inline-math-basic
  source: markdown
  observed: 1.15.0
  text: Let $x_i$ vary.
  regions:
  - kind: inline-math
    range: [4, 9]
    content: [5, 8]
- id: inline-math-space-after-opening
  source: markdown
  observed: 1.15.0
  note: A dollar followed by a space opens nothing, and the last dollar finds no closing one.
  text: Costs $ 5 and $6.
  regions: []
- id: inline-math-escaped-dollar
  source: markdown
  observed: 1.15.0
  text: Price \$5 and $y$.
  regions:
  - kind: inline-math
    range: [14, 17]
    content: [15, 16]
- id: display-math-lines
  source: markdown
  observed: 1.15.0
  text: |
    $$
    a + b
    $$
  regions:
  - kind: display-math
    range: [0, 11]
    content: [2, 9]
- id: display-math-in-paragraph
  source: markdown
  observed: 1.15.0
  text: Thus $$a=b$$ holds.
  regions:
  - kind: display-math
    range: [5, 12]
    content: [7, 10]
- id: heading-with-math-and-wikilink
  source: markdown
  observed: 1.15.0
  text: |
    ## Rate $r$ in [[notes|Notes]]
  regions:
  - kind: heading
    range: [0, 30]
    content: [3, 30]
    attributes:
      level: 2
  - kind: inline-math
    range: [8, 11]
    content: [9, 10]
  - kind: link
    range: [15, 30]
    content: null
    attributes:
      syntax: wiki
      embed: false
  - kind: link-destination
    range: [17, 22]
    content: [17, 22]
  - kind: link-text
    range: [23, 28]
    content: [23, 28]
- id: heading-without-space
  source: markdown
  observed: 1.15.0
  note: A `#` followed by a letter opens a tag, not a heading.
  text: |
    #tag here
  regions: []
- id: markdown-link-with-title
  source: markdown
  observed: 1.15.0
  note: The title belongs to the link, not to its destination.
  text: See [the rule](docs/rule.md "Rule").
  regions:
  - kind: link
    range: [4, 35]
    content: null
    attributes:
      syntax: markdown
      embed: false
  - kind: link-text
    range: [5, 13]
    content: [5, 13]
  - kind: link-destination
    range: [15, 27]
    content: [15, 27]
- id: markdown-link-angle-destination
  source: markdown
  observed: 1.15.0
  text: '[a](<my file.md>)'
  regions:
  - kind: link
    range: [0, 17]
    content: null
    attributes:
      syntax: markdown
      embed: false
  - kind: link-text
    range: [1, 2]
    content: [1, 2]
  - kind: link-destination
    range: [4, 16]
    content: [5, 15]
- id: equal-ranges-enclosing-first
  source: markdown
  observed: 1.15.0
  note: A region sharing its range with the region enclosing it follows that region.
  text: '[$x$](d)'
  regions:
  - kind: link
    range: [0, 8]
    content: null
    attributes:
      syntax: markdown
      embed: false
  - kind: link-text
    range: [1, 4]
    content: [1, 4]
  - kind: inline-math
    range: [1, 4]
    content: [2, 3]
  - kind: link-destination
    range: [6, 7]
    content: [6, 7]
- id: wikilink-block-anchor
  source: markdown
  observed: 1.15.0
  note: A wikilink without an alias has no link text.
  text: '[[note#^anchor]]'
  regions:
  - kind: link
    range: [0, 16]
    content: null
    attributes:
      syntax: wiki
      embed: false
  - kind: link-destination
    range: [2, 14]
    content: [2, 14]
- id: wikilink-destination-with-bracket
  source: markdown
  observed: 1.15.0
  note: A wikilink runs to its first closing, so its destination may hold brackets.
  text: '[[a](b)]]'
  regions:
  - kind: link
    range: [0, 9]
    content: null
    attributes:
      syntax: wiki
      embed: false
  - kind: link-destination
    range: [2, 7]
    content: [2, 7]
- id: wikilink-embed
  source: markdown
  observed: 1.15.0
  text: '![[figure.png]]'
  regions:
  - kind: link
    range: [0, 15]
    content: null
    attributes:
      syntax: wiki
      embed: true
  - kind: link-destination
    range: [3, 13]
    content: [3, 13]
- id: callout-with-display-math
  source: markdown
  observed: 1.15.0
  note: The markers of the quotation that the mathematics crosses are gaps of its content.
  text: |
    > [!NOTE] Title
    > $$
    > a
    > $$
  regions:
  - kind: quotation
    range: [0, 29]
    content: [2, 29]
    gaps: [[16, 18], [21, 23], [25, 27]]
    attributes:
      callout: NOTE
      fold: null
  - kind: display-math
    range: [18, 29]
    content: [20, 27]
    gaps: [[21, 23], [25, 27]]
- id: nested-quotation
  source: markdown
  observed: 1.15.0
  text: |
    > a
    > > b
  regions:
  - kind: quotation
    range: [0, 9]
    content: [2, 9]
    gaps: [[4, 6]]
    attributes:
      callout: null
      fold: null
  - kind: quotation
    range: [6, 9]
    content: [8, 9]
    attributes:
      callout: null
      fold: null
- id: frontmatter-unclosed
  source: markdown
  observed: 1.15.0
  note: A frontmatter fence never closed opens no frontmatter.
  text: |
    ---
    tags: [a]
  regions: []
- id: indented-code
  source: markdown
  observed: 1.15.0
  note: The indentation of the later lines is a gap of the content.
  text: |
    Text

        $a$
        b
  regions:
  - kind: indented-code
    range: [6, 19]
    content: [10, 19]
    gaps: [[14, 18]]
- id: indented-line-continues-paragraph
  source: markdown
  observed: 1.15.0
  note: An indented line continues an open paragraph instead of opening code.
  text: |
    Text
        $a$
  regions:
  - kind: inline-math
    range: [9, 12]
    content: [10, 11]
- id: heading-closing-run
  source: markdown
  observed: 1.15.0
  note: The closing run of markers belongs to no content.
  text: |
    # Title ##
  regions:
  - kind: heading
    range: [0, 10]
    content: [2, 7]
    attributes:
      level: 1
- id: lazy-continuation
  source: markdown
  observed: 1.15.0
  note: A line without marker continues the paragraph of the quotation; inline mathematics stops at the
    line break.
  text: |
    > $a
    b$
  regions:
  - kind: quotation
    range: [0, 7]
    content: [2, 7]
    attributes:
      callout: null
      fold: null
- id: inline-math-closing-after-space
  source: markdown
  observed: 1.15.0
  note: A dollar preceded by a space closes nothing, and the search goes on.
  text: $a $b$
  regions:
  - kind: inline-math
    range: [0, 6]
    content: [1, 5]
