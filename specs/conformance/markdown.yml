  source: markdown
  observed: 1.15.0
  note: A line inside display mathematics opens no block, whatever marker it starts with.
  text: |
    $$
    a
    # b
    $$
  regions:
  - kind: display-math
    range: [0, 11]
    content: [2, 9]
- id: backtick-run-closed-by-narrower-run
  source: markdown
  observed: 1.15.0
  note: A narrower run closes a code span, the excess backticks of the opening run staying literal.
  text: '``foo`bar` baz'
  regions:
  - kind: inline-code
    range: [1, 6]
    content: [2, 5]
- id: backtick-run-closed-by-narrower-run-alone
  source: markdown
  observed: 1.15.0
  note: A narrower run closes a code span, the excess backticks of the opening run staying literal.
  text: '``a` b'
  regions:
  - kind: inline-code
    range: [1, 4]
    content: [2, 3]
- id: image-inside-link-text
  source: markdown
  observed: 1.15.0
  note: The text of a link may hold an embed, as a badge does.
  text: '[![img](a.png)](b.md)'
  regions:
  - kind: link
    range: [0, 21]
    content: null
    attributes:
      syntax: markdown
      embed: false
  - kind: link-text
    range: [1, 14]
    content: [1, 14]
  - kind: link
    range: [1, 14]
    content: null
    attributes:
      syntax: markdown
      embed: true
  - kind: link-text
    range: [3, 6]
    content: [3, 6]
  - kind: link-destination
    range: [8, 13]
    content: [8, 13]
  - kind: link-destination
    range: [16, 20]
    content: [16, 20]
- id: escaped-destination-parenthesis
  source: markdown
  observed: 1.15.0
  note: An escaped parenthesis belongs to the destination.
  text: '[a](b\)c)'
  regions:
  - kind: link
    range: [0, 9]
    content: null
    attributes:
      syntax: markdown
      embed: false
  - kind: link-text
    range: [1, 2]
    content: [1, 2]
  - kind: link-destination
    range: [4, 8]
    content: [4, 8]
- id: escaped-wikilink-separator
  source: markdown
  observed: 1.15.0
