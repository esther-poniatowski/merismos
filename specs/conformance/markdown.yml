      syntax: wiki
      embed: false
  - kind: link-destination
    range: [2, 3]
    content: [2, 3]
  - kind: link-text
    range: [5, 6]
    content: [5, 6]
- id: callout-fold-sign
  source: markdown
  observed: 1.15.0
  text: |
    > [!tip]- T
    > x
  regions:
  - kind: quotation
    range: [0, 15]
    content: [2, 15]
    gaps: [[12, 14]]
    attributes:
      callout: tip
      fold: '-'
- id: display-math-blank-line
  source: markdown
  observed: 1.15.0
  note: A blank line inside display mathematics keeps it open.
  text: |
    $$
    a

    b
    $$
  regions:
  - kind: display-math
    range: [0, 10]
    content: [2, 8]
- id: display-math-blank-lines-around
  source: markdown
  observed: 1.15.0
  note: Blank lines after the opening and before the closing delimiter keep the formula open.
  text: |
    Text.

    $$

    K_{\mathrm{out}} = 1

    $$

    More text.
  regions:
  - kind: display-math
    range: [7, 35]
    content: [9, 33]
- id: backtick-closing-run-wider
  source: markdown
  observed: 1.15.0
  note: A run wider than the opening run closes no code span.
  text: |
    `a`` b
  regions: []
- id: backtick-three-then-one
  source: markdown
  observed: 1.15.0
  note: A single backtick closes a run of three, the two first backticks staying literal.
  text: |
    x ```a` b
  regions:
  - kind: inline-code
    range: [4, 7]
    content: [5, 6]
- id: wikilink-holding-markdown-links
  source: markdown
  observed: 1.15.0
  note: Markdown links inside a wikilink are part of its destination.
  text: |
    [[s](v.md), [o](w.md)]]
  regions:
  - kind: link
    range: [0, 23]
    content: null
    attributes:
      syntax: wiki
      embed: false
  - kind: link-destination
    range: [2, 21]
    content: [2, 21]
- id: escaped-separator-in-table
  source: markdown
  observed: 1.15.0
  note: In a table cell, the escaped separator separates the alias.
  text: |
    | x |
    | - |
    | [[a\|b]] |
  regions:
  - kind: link
    range: [14, 22]
    content: null
    attributes:
      syntax: wiki
      embed: false
  - kind: link-destination
    range: [16, 17]
    content: [16, 17]
  - kind: link-text
    range: [19, 20]
    content: [19, 20]
- id: link-holding-code-span
  source: markdown
  observed: 1.15.0
  note: A link prevails over a code span opening in its text and closing after it.
  text: |
    [a `b](c)` d
  regions:
  - kind: link
    range: [0, 9]
    content: null
    attributes:
      syntax: markdown
      embed: false
  - kind: link-text
    range: [1, 5]
    content: [1, 5]
  - kind: link-destination
    range: [7, 8]
    content: [7, 8]
- id: backtick-skips-wider-run
  source: markdown
  observed: 1.15.0
  note: A wider run neither closes a code span nor stops the search for its closing run.
  text: |
    `a`` b` c
  regions:
  - kind: inline-code
    range: [0, 7]
    content: [1, 6]
- id: code-span-before-crossing-link
  source: markdown
  observed: 1.15.0
  note: A code span opened before a link prevails over the link crossing it.
  text: |
    `a [b` c](d)
  regions:
  - kind: inline-code
    range: [0, 6]
    content: [1, 5]
- id: bracket-in-code-in-link-text
  source: markdown
  observed: 1.15.0
  note: A code span inside the text of a link holds its bracket, which closes no link text.
  text: |
    [a `]` b](c)
  regions:
  - kind: link
    range: [0, 12]
    content: null
    attributes:
      syntax: markdown
      embed: false
  - kind: link-text
    range: [1, 8]
    content: [1, 8]
  - kind: inline-code
    range: [3, 6]
    content: [4, 5]
  - kind: link-destination
    range: [10, 11]
    content: [10, 11]
- id: display-math-unclosed
  source: markdown
  observed: 1.15.0
  note: An unclosed display delimiter opens a formula running to the end of its container, blank lines
    and block markers included.
  text: |
    $$
    a

    # H
  regions:
  - kind: display-math
    range: [0, 9]
    content: [2, 9]
- id: code-span-holding-link
  source: markdown
  observed: 1.15.0
  note: A link inside a code span is code.
  text: |
    `[a](b)`
  regions:
  - kind: inline-code
    range: [0, 8]
    content: [1, 7]
- id: display-math-unclosed-in-paragraph
  source: markdown
  observed: null
  note: An unclosed display delimiter inside a sentence opens a formula running to the end of its container.
  text: |
    Cost $$5 here.

    # H
  regions:
  - kind: display-math
    range: [5, 19]
    content: [7, 19]
