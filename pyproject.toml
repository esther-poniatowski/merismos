# ==================================================================================================
# Pyproject Configuration for the merismos Package
#
# Merismos segments a document into typed regions with exact offsets: frontmatter, code,
# mathematics, headings, quotations and the parts of a link. Each consumer applies its own policy
# to the regions.
# ==================================================================================================

# --- Build System Requirements --------------------------------------------------------------------

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


# --- Package Metadata -----------------------------------------------------------------------------

[project]
name = "merismos"
version = "0.1.0"
authors = [{name = "Esther Poniatowski", email = "esther.poniatowski@ens.psl.eu"}]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
description = "Segments documents into typed regions with exact offsets, for the tools that check texts."
keywords = ["segmentation", "markdown", "obsidian", "regions", "offsets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha"
]
urls = {homepage = "https://github.com/esther-poniatowski/merismos"}


# --- Dependencies ---------------------------------------------------------------------------------

requires-python = ">=3.12"

dependencies = [
    "pyyaml",
    "typer",
]


# --- Package Source Code --------------------------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The syntax files shipped with the package, read at run time through importlib.resources.
[tool.setuptools.package-data]
merismos = ["syntaxes/*.yml", "py.typed"]

# --- CLI Entry Points -----------------------------------------------------------------------------

[project.scripts]
merismos = "merismos.cli:app"

# --- Tool Configurations --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
