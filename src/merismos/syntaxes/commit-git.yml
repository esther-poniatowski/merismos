# A commit message as the default cleanup of Git reads it, with its trailers set apart.
syntax_version: 1
source_type: commit
name: git

comment_character: "#"
strip_trailing_whitespace: true
collapse_blank_lines: true
# first-paragraph, as Git reads the subject, or first-line.
subject: first-paragraph
# A trailer line opens with a token, a colon and a space, such as "Signed-off-by: ".
trailer_pattern: "[A-Za-z0-9][A-Za-z0-9-]*: "
