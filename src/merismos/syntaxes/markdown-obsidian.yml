# Syntax of the Markdown dialect read by Obsidian, as far as the conformance cases of Merismos
# state it. A section set to null disables its construct.
syntax_version: 1
source_type: markdown
name: obsidian

# Columns between two tab stops, and columns admitted before the marker of a block.
tab_width: 4
block_indent: 3

frontmatter:
  fence: "---"

fences:
  characters: ["`", "~"]
  minimum_length: 3
  # The info string of a backtick fence holds no backtick, as in CommonMark.
  info_excludes_fence: ["`"]

indented_code:
  indent: 4

headings:
  marker: "#"
  maximum_level: 6

quotations:
  marker: ">"
  # Columns of space after the marker that belong to the marker rather than to the content.
  spacing: 1
  callout:
    opening: "[!"
    closing: "]"
    # The type of a callout, as written between its delimiters.
    type_pattern: "[A-Za-z0-9_-]+"
    fold_signs: ["+", "-"]

lists:
  bullets: ["-", "*", "+"]
  ordered_delimiters: [".", ")"]
  maximum_digits: 9
  # Columns of spacing after a marker that still set the indentation of the content.
  maximum_spacing: 4

thematic_breaks:
  characters: ["-", "*", "_"]
  minimum_count: 3

# A run of these characters under a paragraph closes the paragraph.
setext_underlines: ["=", "-"]

code_span: "`"

math:
  display: "$$"
  inline: "$"
  inline_spans_lines: false
  # Whether a blank line inside display mathematics keeps it open; to be observed in Obsidian.
  display_spans_blank_lines: false

links:
  markdown:
    text_opening: "["
    text_closing: "]"
    destination_opening: "("
    destination_closing: ")"
    destination_brackets: ["<", ">"]
    # Each pair names the opening and the closing character of a title.
    title_delimiters: ['""', "''", "()"]
  # Whether the text of a Markdown link may hold embeds, as an image inside a link does.
  embeds_in_text: true
  wikilink:
    opening: "[["
    closing: "]]"
    alias_separator: "|"
    # Obsidian links no file whose name holds a bracket, so `[[a](b)]]` holds no wikilink.
    excluded: "[]"
  embed_prefix: "!"

escape:
  character: "\\"
  # The ASCII punctuation characters, as CommonMark admits them after a backslash.
  escapable: "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~"
